<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catalogue admin — Chantier.online</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="styles.css"><script src="config.js"></script></head>
<body class="bg-slate-50 text-slate-800"><header class="bg-white shadow-sm"><div class="max-w-6xl mx-auto p-4 flex justify-between"><a href="admin.html" class="font-bold">← Administration</a><strong>Gestionnaire de catalogue</strong></div></header>
<main class="max-w-6xl mx-auto p-4"><div id="denied" class="hidden bg-red-50 p-4 rounded">Accès réservé à l’administrateur.</div><div id="app" class="hidden">
<section class="bg-white p-4 rounded-xl shadow mb-6"><h1 class="text-2xl font-bold mb-3">Ajouter / modifier un produit</h1>
<form id="form" class="grid md:grid-cols-3 gap-3">
<input id="id" required placeholder="Référence (ex. CIM-50)" class="border p-2 rounded"><input id="nameFr" required placeholder="Nom français" class="border p-2 rounded"><input id="nameEn" required placeholder="Nom anglais" class="border p-2 rounded">
<input id="unit" required placeholder="Unité" class="border p-2 rounded"><input id="price" required type="number" min="0" step=".01" placeholder="Prix USD" class="border p-2 rounded"><input id="stockQty" type="number" min="0" step=".001" placeholder="Stock" class="border p-2 rounded">
<select id="category" class="border p-2 rounded"><option value="produits">Produits</option><option value="services">Services</option><option value="facilitation">Facilitation</option><option value="partenaires">Partenaires</option></select><input id="catalogGroup" placeholder="Sous-catégorie" class="border p-2 rounded">
<div class="md:col-span-3"><div class="flex justify-between"><b>Photos (URL HTTPS)</b><button type="button" id="add-image" class="border rounded px-2">+ Photo</button></div><div id="images"></div></div>
<div class="md:col-span-3"><div class="flex justify-between"><b>Fiche technique</b><button type="button" id="add-spec" class="border rounded px-2">+ Caractéristique</button></div><div id="specs"></div></div>
<div class="md:col-span-3 flex gap-2"><button class="signal-button text-white rounded px-4 py-2" type="submit">Enregistrer</button><button id="reset" class="border rounded px-4 py-2" type="button">Nouveau</button></div></form><p id="status" class="text-sm mt-2"></p></section>
<section><h2 class="text-xl font-bold mb-3">Produits</h2><div id="list" class="space-y-3"></div></section></div></main><script src="admin-catalog.js"></script></body></html>
