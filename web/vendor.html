<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Espace partenaire — MonChantier</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <header class="bg-white shadow-sm sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-2">
      <a href="index.html" class="brand-name flex items-center gap-2 font-bold text-xl">
        <img src="assets/monchantier_logo.svg" alt="MonChantier" class="h-10 w-auto">MonChantier
      </a>
      <div class="flex items-center gap-2 text-sm md:text-base">
        <span id="whoami" class="text-slate-500 hidden sm:inline"></span>
        <button id="logout-button" type="button" class="px-2 py-2 font-medium text-slate-600 hover:text-red-700">Déconnexion</button>
      </div>
    </div>
  </header>

  <main class="page-surface max-w-5xl mx-auto px-4 py-4 md:py-8">
    <h1 class="text-2xl md:text-3xl font-bold mb-1">Espace partenaire</h1>
    <p class="text-slate-500 text-sm mb-4">Gérez votre catalogue et préparez vos articles sur les commandes qui vous concernent.</p>

    <div id="denied" class="hidden bg-white rounded-xl p-6 shadow text-slate-700">
      Cet espace est réservé aux comptes partenaires. <a href="index.html" class="text-red-600 underline">Retour au site</a>.
    </div>

    <div id="dashboard" class="hidden">
      <section>
        <h2 class="text-xl font-bold mb-3">Mon catalogue</h2>
        <form id="product-form" class="bg-white rounded-xl p-4 shadow grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
          <div>
            <label class="block text-xs font-medium mb-1" for="product-name-fr">Nom (français)</label>
            <input id="product-name-fr" type="text" required class="w-full border rounded-lg px-3 py-2 text-sm">
          </div>
          <div>
            <label class="block text-xs font-medium mb-1" for="product-name-en">Nom (anglais)</label>
            <input id="product-name-en" type="text" required class="w-full border rounded-lg px-3 py-2 text-sm">
          </div>
          <div>
            <label class="block text-xs font-medium mb-1" for="product-unit">Unité (ex: pcs, trajet, m³)</label>
            <input id="product-unit" type="text" required class="w-full border rounded-lg px-3 py-2 text-sm">
          </div>
          <div>
            <label class="block text-xs font-medium mb-1" for="product-price">Prix (USD)</label>
            <input id="product-price" type="number" step="0.01" min="0" required class="w-full border rounded-lg px-3 py-2 text-sm">
          </div>
          <div>
            <label class="block text-xs font-medium mb-1" for="product-category">Catégorie</label>
            <select id="product-category" class="w-full border rounded-lg px-3 py-2 text-sm">
              <option value="partenaires">Partenaires (transport, équipement...)</option>
              <option value="produits">Produits (matériaux)</option>
              <option value="services">Services (artisans...)</option>
              <option value="facilitation">Facilitation</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium mb-1" for="product-stock">Stock / disponibilité</label>
            <input id="product-stock" type="number" step="1" min="0" value="0" class="w-full border rounded-lg px-3 py-2 text-sm">
          </div>
          <button type="submit" class="signal-button md:col-span-2 px-4 py-2 rounded-lg text-white text-sm w-full md:w-auto">Publier ce produit/service</button>
        </form>
        <p id="product-form-status" class="text-sm mb-3" role="status" aria-live="polite"></p>
        <div id="products-list" class="space-y-2"></div>
      </section>

      <section class="mt-10 border-t border-slate-200 pt-6">
        <h2 class="text-xl font-bold mb-3">Commandes à préparer</h2>
        <p id="orders-status" class="text-sm mb-3" role="status" aria-live="polite"></p>
        <div id="orders-list" class="space-y-2"></div>
      </section>
    </div>
  </main>

  <script src="vendor.js"></script>
</body>
</html>
