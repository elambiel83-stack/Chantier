<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion | MonChantier</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
  <main class="mx-auto grid min-h-screen max-w-5xl items-center gap-8 px-4 py-10 md:grid-cols-2">
    <section>
      <a href="index.html" class="brand-name inline-flex items-center gap-2 font-bold text-xl"><img src="assets/monchantier_logo.svg" alt="" class="h-10 w-auto">MonChantier</a>
      <h1 class="mt-8 text-3xl font-bold">Votre compte chantier</h1>
      <p class="mt-3 max-w-md text-slate-600">Retrouvez vos commandes et suivez leur traitement depuis un espace personnel sécurisé.</p>
    </section>
    <section class="page-surface border border-slate-200 bg-white p-6 shadow-sm">
      <div class="grid grid-cols-2 border-b border-slate-200">
        <button type="button" data-auth-view="login" class="auth-tab border-b-2 border-red-600 px-3 py-3 font-semibold text-red-700">Connexion</button>
        <button type="button" data-auth-view="register" class="auth-tab px-3 py-3 font-semibold text-slate-600">Créer un compte</button>
      </div>
      <form id="login-form" class="mt-6 space-y-4">
        <div><label for="login-email" class="block text-sm font-medium">E-mail</label><input id="login-email" name="email" type="email" autocomplete="email" required class="mt-1 w-full border border-slate-300 px-3 py-2"></div>
        <div><label for="login-password" class="block text-sm font-medium">Mot de passe</label><input id="login-password" name="password" type="password" autocomplete="current-password" required class="mt-1 w-full border border-slate-300 px-3 py-2"></div>
        <button type="submit" class="w-full bg-red-600 px-4 py-3 font-semibold text-white hover:bg-red-700">Se connecter</button>
        <a href="forgot-password.html" class="block text-center text-sm font-semibold text-red-700 hover:underline">Mot de passe oublié ?</a>
      </form>
      <form id="register-form" class="mt-6 hidden space-y-4">
        <div><label for="register-name" class="block text-sm font-medium">Nom complet</label><input id="register-name" name="fullName" type="text" autocomplete="name" required class="mt-1 w-full border border-slate-300 px-3 py-2"></div>
        <div><label for="register-phone" class="block text-sm font-medium">Téléphone</label><input id="register-phone" name="phone" type="tel" autocomplete="tel" required class="mt-1 w-full border border-slate-300 px-3 py-2"></div>
        <div><label for="register-email" class="block text-sm font-medium">E-mail</label><input id="register-email" name="email" type="email" autocomplete="email" required class="mt-1 w-full border border-slate-300 px-3 py-2"></div>
        <div><label for="register-password" class="block text-sm font-medium">Mot de passe</label><input id="register-password" name="password" type="password" autocomplete="new-password" minlength="12" required class="mt-1 w-full border border-slate-300 px-3 py-2"><p class="mt-1 text-xs text-slate-500">12 caractères minimum.</p></div>
        <button type="submit" class="w-full bg-red-600 px-4 py-3 font-semibold text-white hover:bg-red-700">Créer mon compte</button>
      </form>
      <p id="auth-status" class="mt-4 text-sm" role="status" aria-live="polite"></p>
      <div id="social-auth" hidden>
        <div class="mt-6 flex items-center gap-3 text-xs font-medium uppercase tracking-wide text-slate-400">
          <span class="h-px flex-1 bg-slate-200"></span>ou<span class="h-px flex-1 bg-slate-200"></span>
        </div>
        <div class="mt-4 space-y-3">
          <div id="google-signin-button" class="flex justify-center" hidden></div>
          <button id="facebook-signin-button" type="button" class="flex w-full items-center justify-center gap-2 border border-slate-300 px-4 py-3 font-semibold text-slate-700 hover:bg-slate-50" hidden>
            <span aria-hidden="true">📘</span>Continuer avec Facebook
          </button>
        </div>
      </div>
    </section>
  </main>
  <script src="auth.js"></script>
</body>
</html>
