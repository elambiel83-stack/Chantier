<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Commandes — MonChantier</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <header class="bg-white shadow-sm sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-2">
      <a href="index.html" class="brand-name flex items-center gap-2 font-bold text-xl">
        <img src="assets/monchantier_logo.svg" alt="MonChantier" class="h-10 w-auto">MonChantier
      </a>
      <div class="flex items-center gap-2 text-sm md:text-base">
        <span id="whoami" class="text-slate-500 hidden sm:inline"></span>
        <button id="logout-button" type="button" class="px-2 py-2 font-medium text-slate-600 hover:text-red-700">Déconnexion</button>
      </div>
    </div>
  </header>

  <main class="page-surface max-w-5xl mx-auto px-4 py-4 md:py-8">
    <h1 class="text-2xl md:text-3xl font-bold mb-1">Commandes</h1>
    <p id="scope-note" class="text-slate-500 text-sm mb-4"></p>

    <div id="denied" class="hidden bg-white rounded-xl p-6 shadow text-slate-700">
      Cet espace est réservé au personnel MonChantier (staff/admin). <a href="index.html" class="text-red-600 underline">Retour au site</a>.
    </div>

    <div id="dashboard" class="hidden">
      <div class="flex flex-wrap items-center gap-2 mb-4">
        <label class="text-sm font-medium" for="status-filter">Statut</label>
        <select id="status-filter" class="border rounded-lg px-3 py-2 text-sm">
          <option value="">Toutes (selon mes droits)</option>
          <option value="pending">En attente</option>
          <option value="confirmed">Confirmée</option>
          <option value="delivering">En livraison</option>
          <option value="completed">Terminée</option>
          <option value="cancelled">Annulée</option>
        </select>
        <button id="refresh" type="button" class="ml-auto px-3 py-2 rounded-lg border text-sm hover:bg-slate-100">Actualiser</button>
      </div>
      <p id="orders-status" class="text-sm mb-3" role="status" aria-live="polite"></p>
      <div id="orders" class="space-y-3"></div>

      <div id="vendors-section" class="hidden mt-10 border-t border-slate-200 pt-6">
        <h2 class="text-xl font-bold mb-1">Partenaires</h2>
        <p class="text-slate-500 text-sm mb-4">Transporteurs, fournisseurs, artisans... chaque partenaire gère son propre catalogue et prépare ses articles sur les commandes qui les concernent.</p>

        <form id="vendor-create-form" class="bg-white rounded-xl p-4 shadow flex flex-wrap items-end gap-3 mb-4">
          <div>
            <label class="block text-xs font-medium mb-1" for="vendor-email">E-mail du compte (déjà inscrit)</label>
            <input id="vendor-email" type="email" required class="border rounded-lg px-3 py-2 text-sm w-56">
          </div>
          <div>
            <label class="block text-xs font-medium mb-1" for="vendor-business-name">Nom commercial</label>
            <input id="vendor-business-name" type="text" required class="border rounded-lg px-3 py-2 text-sm w-56">
          </div>
          <div>
            <label class="block text-xs font-medium mb-1" for="vendor-category">Catégorie</label>
            <select id="vendor-category" class="border rounded-lg px-3 py-2 text-sm">
              <option value="partenaires">Partenaires (transport, équipement...)</option>
              <option value="produits">Produits (matériaux)</option>
              <option value="services">Services (artisans...)</option>
              <option value="facilitation">Facilitation</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium mb-1" for="vendor-phone">Téléphone (optionnel)</label>
            <input id="vendor-phone" type="tel" class="border rounded-lg px-3 py-2 text-sm w-40">
          </div>
          <button type="submit" class="signal-button px-4 py-2 rounded-lg text-white text-sm">Créer le partenaire</button>
        </form>
        <p id="vendor-create-status" class="text-sm mb-3" role="status" aria-live="polite"></p>
        <div id="vendors-list" class="space-y-2"></div>
      </div>
    </div>
  </main>

  <script src="admin.js"></script>
</body>
</html>
