<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panier — MonChantier</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <div class="page-surface max-w-4xl mx-auto px-4 py-4 md:py-8">
    <h1 class="text-2xl md:text-3xl font-bold mb-4 md:mb-6"><span data-i18n="cart">Panier</span> <span id="cart-count" class="hidden rounded-full bg-red-600 px-2 py-1 text-sm text-white">0</span></h1>
    <div id="items" class="space-y-3 md:space-y-4"></div>
    <div class="mt-6 md:mt-8 border-t border-slate-200 pt-4 sm:ml-auto sm:max-w-sm">
      <div class="flex justify-between text-sm"><span>Sous-total</span><strong id="subtotal">0</strong></div>
      <div class="mt-2 flex justify-between text-sm text-slate-500"><span>Livraison</span><span>À confirmer</span></div>
      <div class="mt-3 flex justify-between border-t border-slate-200 pt-3 text-lg font-bold"><span>Total à facturer</span><span id="total">0</span></div>
    </div>
    <form id="checkout-form" class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-4" novalidate>
      <div>
        <label class="block text-sm font-medium mb-1" for="customer-name">Nom complet</label>
        <input id="customer-name" name="fullName" type="text" autocomplete="name" required class="w-full border rounded-lg px-3 py-2">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1" for="customer-phone">Téléphone</label>
        <input id="customer-phone" name="phone" type="tel" autocomplete="tel" required class="w-full border rounded-lg px-3 py-2">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1" for="customer-email">E-mail (optionnel)</label>
        <input id="customer-email" name="email" type="email" autocomplete="email" class="w-full border rounded-lg px-3 py-2">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1" for="checkout-currency">Devise</label>
        <select id="checkout-currency" name="currency" class="w-full border rounded-lg px-3 py-2">
          <option value="USD">USD</option><option value="CDF">CDF</option><option value="EUR">EUR</option>
        </select>
      </div>
      <fieldset class="md:col-span-2">
        <legend class="block text-sm font-medium mb-1">Moyen de paiement</legend>
        <div class="flex flex-wrap gap-4">
          <label><input type="radio" name="paymentProvider" value="paypal" checked> PayPal</label>
          <label><input type="radio" name="paymentProvider" value="airtel_money"> Airtel Money</label>
          <label><input type="radio" name="paymentProvider" value="orange_money"> Orange Money</label>
        </div>
      </fieldset>
      <label class="md:col-span-2 flex gap-2 text-sm text-slate-600"><input type="checkbox" id="consent-checkbox" required> J'accepte les <a class="text-red-600 underline" href="terms.html">conditions de vente</a> et la <a class="text-red-600 underline" href="privacy.html">politique de confidentialité</a>.</label>
      <div class="md:col-span-2">
        <label class="block text-sm font-medium mb-1">Position de livraison (optionnel)</label>
        <button type="button" id="share-location" data-i18n="shareLocationBtn" class="px-3 py-2 rounded-lg border text-sm hover:bg-slate-50" disabled>Partager ma position</button>
        <span id="location-status" class="ml-2 text-sm text-slate-500"></span>
      </div>
      <button id="checkout" type="submit" class="signal-button w-full md:w-auto px-4 md:px-5 py-3 rounded-xl bg-red-600 text-white hover:bg-red-700 text-center text-sm md:text-base" data-i18n="pay">Payer et commander</button>
      <p id="checkout-status" class="md:col-span-2 text-sm" role="status" aria-live="polite"></p>
    </form>
    <p class="text-slate-500 mt-4 md:mt-6 text-sm md:text-base" data-i18n="cartNote">Partager votre position aide notre équipe à livrer plus vite — votre commande reste possible sans elle.</p>
  </div>
  <script src="products.js"></script>
  <script src="site.js"></script>
</body>
</html>
