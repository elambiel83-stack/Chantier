<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nouveau mot de passe | MonChantier</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
</head>
<body class="min-h-screen">
  <main class="mx-auto flex min-h-screen max-w-lg items-center px-4 py-10">
    <section class="page-surface w-full p-6 md:p-8">
      <a href="index.html" class="brand-name inline-flex items-center gap-2 font-bold text-xl"><img src="assets/monchantier_logo.svg" alt="" class="h-10 w-auto">MonChantier</a>
      <h1 class="mt-8 text-3xl font-bold">Nouveau mot de passe</h1>
      <form id="reset-form" class="mt-6 space-y-4">
        <div><label for="password" class="block text-sm font-medium">Nouveau mot de passe</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="12" required class="mt-1 w-full border px-3 py-2"><p class="mt-1 text-xs text-slate-500">12 caractères minimum.</p></div>
        <div><label for="confirm-password" class="block text-sm font-medium">Confirmer le mot de passe</label><input id="confirm-password" type="password" autocomplete="new-password" minlength="12" required class="mt-1 w-full border px-3 py-2"></div>
        <button type="submit" class="signal-button w-full px-4 py-3 font-semibold text-white">Réinitialiser le mot de passe</button>
      </form>
      <p id="reset-status" class="mt-4 text-sm" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script>
    const form = document.getElementById('reset-form');
    const status = document.getElementById('reset-status');
    const token = new URLSearchParams(window.location.hash.slice(1)).get('token');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = document.getElementById('password').value;
      if (!token) { status.textContent = 'Lien de réinitialisation manquant.'; return; }
      if (password !== document.getElementById('confirm-password').value) { status.textContent = 'Les mots de passe ne correspondent pas.'; return; }
      const button = form.querySelector('button');
      button.disabled = true;
      try {
        const data = await window.apiCall(window.API_CONFIG.endpoints.resetPassword, { method: 'POST', body: { token, password } }, false);
        status.textContent = data.message;
        status.className = 'mt-4 text-sm text-green-700';
        form.reset();
        window.history.replaceState(null, '', window.location.pathname);
        setTimeout(() => window.location.assign('auth.html'), 1600);
      } catch (error) {
        status.textContent = error.message;
        status.className = 'mt-4 text-sm text-red-700';
      } finally { button.disabled = false; }
    });
  </script>
</body>
</html>
