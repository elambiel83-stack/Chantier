<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mot de passe oublié | MonChantier</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
</head>
<body class="min-h-screen">
  <main class="mx-auto flex min-h-screen max-w-lg items-center px-4 py-10">
    <section class="page-surface w-full p-6 md:p-8">
      <a href="auth.html" class="brand-name inline-flex items-center gap-2 font-bold text-xl"><img src="assets/monchantier_logo.svg" alt="" class="h-10 w-auto">MonChantier</a>
      <h1 class="mt-8 text-3xl font-bold">Mot de passe oublié</h1>
      <p class="mt-3 text-slate-600">Choisissez un canal sécurisé pour recevoir votre lien de réinitialisation.</p>
      <form id="forgot-form" class="mt-6 space-y-4">
        <fieldset>
          <legend class="mb-2 text-sm font-medium">Recevoir le lien par</legend>
          <div class="grid grid-cols-3 gap-2">
            <label class="channel-choice"><input type="radio" name="channel" value="email" checked> <span>E-mail</span></label>
            <label class="channel-choice"><input type="radio" name="channel" value="sms"> <span>SMS</span></label>
            <label class="channel-choice"><input type="radio" name="channel" value="whatsapp"> <span>WhatsApp</span></label>
          </div>
        </fieldset>
        <div><label for="identifier" class="block text-sm font-medium">E-mail ou numéro de téléphone</label><input id="identifier" name="identifier" type="text" autocomplete="email tel" required class="mt-1 w-full border px-3 py-2" placeholder="contact@monchantier.net ou +243..."></div>
        <button type="submit" class="signal-button w-full px-4 py-3 font-semibold text-white">Envoyer le lien</button>
      </form>
      <p id="forgot-status" class="mt-4 text-sm" role="status" aria-live="polite"></p>
      <a href="auth.html" class="mt-5 block text-center text-sm font-semibold text-red-700 hover:underline">Retour à la connexion</a>
    </section>
  </main>
  <script>
    const form = document.getElementById('forgot-form');
    const status = document.getElementById('forgot-status');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = form.querySelector('button');
      button.disabled = true;
      status.textContent = 'Envoi en cours...';
      try {
        const data = await window.apiCall(window.API_CONFIG.endpoints.forgotPassword, { method: 'POST', body: Object.fromEntries(new FormData(form)) }, false);
        status.textContent = data.message;
        status.className = 'mt-4 text-sm text-green-700';
      } catch (error) {
        status.textContent = error.message;
        status.className = 'mt-4 text-sm text-red-700';
      } finally { button.disabled = false; }
    });
  </script>
</body>
</html>
