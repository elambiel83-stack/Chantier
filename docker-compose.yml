services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: monchantier
      POSTGRES_USER: monchantier
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

volumes:
  postgres_data: