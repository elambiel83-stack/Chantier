openapi: 3.0.3
info:
  title: MonChantier API
  version: 1.0.0
  description: API de catalogue, paniers et commandes MonChantier.
servers:
  - url: http://localhost:3000/api
    description: Environnement local
paths:
  /products:
    get:
      summary: Liste les produits
      parameters:
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
      responses:
        '200':
          description: Produits disponibles
  /organizations:
    get:
      summary: Annuaire public des vendeurs vérifiés
      responses:
        '200':
          description: Vendeurs dont le statut est 'verified'
  /vendor/organizations:
    get:
      summary: Organisations dont le compte authentifié est membre, avec son rôle dans chacune
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Organisations du compte
        '401':
          description: Authentification requise
  /vendor/products:
    post:
      summary: Crée un produit pour le compte d'une organisation vendeur
      description: >-
        Réservé à un membre de l'organisation avec un rôle catalogue (owner, manager,
        sales) ou à un admin plateforme. L'identifiant du produit est généré côté serveur.
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Produit créé
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: Authentification requise
        '403':
          description: Droits insuffisants sur cette organisation
        '404':
          description: Organisation introuvable
        '503':
          description: Service indisponible (base de données non configurée)
  /vendor/products/{id}:
    patch:
      summary: Modifie un produit existant appartenant à l'organisation du compte authentifié
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Produit modifié
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: Authentification requise
        '403':
          description: Droits insuffisants sur ce produit
        '404':
          $ref: '#/components/responses/NotFound'
  /services:
    get:
      summary: Annuaire public des prestations sur devis (nécessitant une visite de terrain)
      responses:
        '200':
          description: Prestations actives de vendeurs vérifiés
        '503':
          description: Service indisponible (base de données non configurée)
  /vendor/services:
    post:
      summary: Crée une prestation pour le compte d'une organisation vendeur
      description: >-
        Contrairement à un produit, une prestation n'a ni prix ni stock: le prix se fixe
        après la visite de terrain, consigné sur le rendez-vous correspondant (voir
        PATCH /appointments/{appointmentId}/status).
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Prestation créée
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: Authentification requise
        '403':
          description: Droits insuffisants sur cette organisation
        '404':
          description: Organisation introuvable
  /vendor/services/{id}:
    patch:
      summary: Modifie une prestation existante appartenant à l'organisation du compte authentifié
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Prestation modifiée
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: Authentification requise
        '403':
          description: Droits insuffisants sur cette prestation
        '404':
          $ref: '#/components/responses/NotFound'
  /appointments:
    post:
      summary: Demande un rendez-vous de visite pour une prestation sur devis
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Rendez-vous créé au statut 'requested'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: Authentification requise
        '404':
          description: Prestation introuvable (inexistante, inactive, ou vendeur non vérifié)
    get:
      summary: Liste les rendez-vous du compte authentifié (ses demandes, et ceux de ses organisations vendeur)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Rendez-vous visibles par le compte authentifié
        '401':
          description: Authentification requise
  /appointments/{appointmentId}/status:
    patch:
      summary: Fait transiter un rendez-vous (confirmation du créneau, puis devis chiffré après la visite)
      description: >-
        Réservé à un membre catalogue de l'organisation vendeur concernée, ou à un admin.
        scheduledAt est requis pour confirmer un rendez-vous. quotedAmountUsd/quoteNote se
        renseignent typiquement en même temps que le passage à 'completed'.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Rendez-vous mis à jour
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: Authentification requise
        '403':
          description: Droits insuffisants sur cette organisation
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Transition de statut non autorisée
  /appointments/{appointmentId}/order:
    post:
      summary: Convertit un rendez-vous complété (devis chiffré) en commande payante
      description: >-
        Réservé au client propriétaire du rendez-vous. Réutilise le même cycle de paiement
        qu'une commande issue du panier (capture PayPal, confirmation Airtel/Orange Money,
        commission, séquestre) — une seule ligne, un seul vendeur.
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Commande créée à partir du devis
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: Authentification requise
        '403':
          description: Ce rendez-vous n'appartient pas au compte authentifié
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Ce rendez-vous a déjà été converti en commande
  /admin/payouts/pending:
    get:
      summary: Montant net dû à chaque vendeur (séquestre libéré, pas encore versé)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Un élément par vendeur ayant quelque chose en attente de versement
        '401':
          description: Authentification requise
        '403':
          description: Droits insuffisants (réservé aux admins)
  /admin/organizations/{organizationId}/payouts:
    post:
      summary: Verse à un vendeur tout ce qui lui est dû
      description: >-
        method=manual enregistre un versement déjà effectué par le staff par ses propres
        moyens. method=cinetpay_transfer déclenche un transfert automatisé via CinetPay
        (voir backend/cinetpay.js — non vérifié par exécution réelle, répond 503 tant que
        CINETPAY_API_KEY n'est pas configuré).
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Versement enregistré, séquestre correspondant marqué comme versé
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: Authentification requise
        '403':
          description: Droits insuffisants (réservé aux admins)
        '502':
          description: Le transfert CinetPay a échoué
        '503':
          description: CinetPay n'est pas configuré
  /currency-rates:
    get:
      summary: Taux de change officiels utilisés pour la facturation
      responses:
        '200':
          description: Taux par devise, en unités par USD
  /products/{id}:
    get:
      summary: Récupère un produit
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Produit trouvé
        '404':
          $ref: '#/components/responses/NotFound'
  /products/category/{category}:
    get:
      summary: Liste les produits d'une catégorie
      parameters:
        - in: path
          name: category
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Produits de la catégorie
  /cart/session:
    post:
      summary: Crée un identifiant de panier non devinable
      responses:
        '201':
          description: Session créée
  /cart:
    post:
      summary: Enregistre un panier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartRequest'
      responses:
        '200':
          description: Panier enregistré
        '400':
          $ref: '#/components/responses/InvalidRequest'
  /cart/{sessionId}:
    get:
      summary: Récupère un panier
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Panier trouvé
    delete:
      summary: Supprime un panier
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Panier supprimé
  /orders:
    post:
      summary: Crée une commande, réserve le stock et ouvre une tentative de paiement
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '201':
          description: >-
            Commande créée et stock réservé. La réponse contient aussi `vendorOrders`
            (un élément par vendeur présent dans le panier, avec son sous-total en USD):
            un panier peut mêler plusieurs vendeurs, chacun assurant sa propre préparation
            et livraison, même si le paiement reste unique pour toute la commande. Pour
            airtel_money/orange_money, la réponse contient aussi `payment` (numéro
            marchand et référence à utiliser pour payer);
            la confirmation elle-même reste manuelle (voir PATCH /orders/{orderId}/status).
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: Authentification requise
        '409':
          description: Stock insuffisant pour au moins un produit
        '503':
          description: >-
            Service de commande indisponible, ou moyen de paiement Airtel/Orange Money
            non configuré (numéro marchand manquant)
  /orders/{orderId}/paypal:
    post:
      summary: Crée une approbation PayPal pour une commande USD ou EUR du client authentifié
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: >-
            URL d'approbation PayPal créée. La réponse contient aussi le jeton de
            confirmation à usage unique, également placé dans l'URL de retour (paramètre ct).
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: Authentification requise
        '404':
          $ref: '#/components/responses/NotFound'
  /orders/{orderId}/paypal/capture:
    post:
      summary: Capture un paiement PayPal approuvé
      description: >-
        Appelée par la page de retour PayPal, sans session: l'accès est prouvé par le jeton
        de confirmation reçu à la création du paiement. Le montant encaissé est vérifié.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmationToken]
              properties:
                confirmationToken:
                  type: string
                  description: Jeton reçu dans l'URL de retour (paramètre ct)
      responses:
        '200':
          description: Paiement capturé et commande confirmée
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          description: Jeton de confirmation invalide
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProductId:
      in: path
      name: id
      required: true
      schema:
        type: string
    SessionId:
      in: path
      name: sessionId
      required: true
      schema:
        type: string
        format: uuid
    OrderId:
      in: path
      name: orderId
      required: true
      schema:
        type: string
        format: uuid
  responses:
    InvalidRequest:
      description: Requête invalide ou règle métier non satisfaite
    NotFound:
      description: Ressource introuvable
  schemas:
    CartItem:
      type: object
      required: [id, qty]
      properties:
        id:
          type: string
          maxLength: 32
        qty:
          type: integer
          minimum: 1
          maximum: 10000
    CartRequest:
      type: object
      required: [sessionId, items]
      properties:
        sessionId:
          type: string
          format: uuid
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/CartItem'
    OrderRequest:
      type: object
      required: [customer, currency, paymentProvider, items]
      properties:
        customer:
          type: object
          required: [fullName, phone]
          properties:
            fullName:
              type: string
              minLength: 2
              maxLength: 120
            phone:
              type: string
              minLength: 6
              maxLength: 30
            email:
              type: string
              format: email
        currency:
          type: string
          enum: [USD, CDF, EUR]
        paymentProvider:
          type: string
          enum: [paypal, airtel_money, orange_money]
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/CartItem'
