openapi: 3.0.3
info:
  title: MonChantier API
  version: 1.0.0
  description: API de catalogue, paniers et commandes MonChantier.
servers:
  - url: http://localhost:3000/api
    description: Environnement local
paths:
  /products:
    get:
      summary: Liste les produits
      parameters:
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
      responses:
        '200':
          description: Produits disponibles
  /currency-rates:
    get:
      summary: Taux de change officiels utilisés pour la facturation
      responses:
        '200':
          description: Taux par devise, en unités par USD
  /products/{id}:
    get:
      summary: Récupère un produit
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Produit trouvé
        '404':
          $ref: '#/components/responses/NotFound'
  /products/category/{category}:
    get:
      summary: Liste les produits d'une catégorie
      parameters:
        - in: path
          name: category
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Produits de la catégorie
  /cart/session:
    post:
      summary: Crée un identifiant de panier non devinable
      responses:
        '201':
          description: Session créée
  /cart:
    post:
      summary: Enregistre un panier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartRequest'
      responses:
        '200':
          description: Panier enregistré
        '400':
          $ref: '#/components/responses/InvalidRequest'
  /cart/{sessionId}:
    get:
      summary: Récupère un panier
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Panier trouvé
    delete:
      summary: Supprime un panier
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Panier supprimé
  /orders:
    post:
      summary: Crée une commande, réserve le stock et ouvre une tentative de paiement
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '201':
          description: >-
            Commande créée et stock réservé. Pour airtel_money/orange_money, la réponse
            contient aussi `payment` (numéro marchand et référence à utiliser pour payer);
            la confirmation elle-même reste manuelle (voir PATCH /orders/{orderId}/status).
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: Authentification requise
        '409':
          description: Stock insuffisant pour au moins un produit
        '503':
          description: >-
            Service de commande indisponible, ou moyen de paiement Airtel/Orange Money
            non configuré (numéro marchand manquant)
  /orders/{orderId}/paypal:
    post:
      summary: Crée une approbation PayPal pour une commande USD ou EUR du client authentifié
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: >-
            URL d'approbation PayPal créée. La réponse contient aussi le jeton de
            confirmation à usage unique, également placé dans l'URL de retour (paramètre ct).
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: Authentification requise
        '404':
          $ref: '#/components/responses/NotFound'
  /orders/{orderId}/paypal/capture:
    post:
      summary: Capture un paiement PayPal approuvé
      description: >-
        Appelée par la page de retour PayPal, sans session: l'accès est prouvé par le jeton
        de confirmation reçu à la création du paiement. Le montant encaissé est vérifié.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmationToken]
              properties:
                confirmationToken:
                  type: string
                  description: Jeton reçu dans l'URL de retour (paramètre ct)
      responses:
        '200':
          description: Paiement capturé et commande confirmée
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          description: Jeton de confirmation invalide
        '404':
          $ref: '#/components/responses/NotFound'
  /orders/{orderId}/cinetpay:
    post:
      summary: Crée un paiement CinetPay (Mobile Money automatisé) pour une commande USD ou CDF du client authentifié
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: >-
            URL de paiement CinetPay créée. La réponse contient aussi le jeton de
            confirmation à usage unique, également placé dans l'URL de retour (paramètre ct).
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: Authentification requise
        '404':
          $ref: '#/components/responses/NotFound'
  /orders/{orderId}/cinetpay/check:
    post:
      summary: Vérifie et finalise un paiement CinetPay auprès de l'API CinetPay
      description: >-
        Appelée par la page de retour CinetPay, sans session: l'accès est prouvé par le
        jeton de confirmation reçu à la création du paiement. Le statut et le montant
        renvoyés proviennent toujours d'un appel à l'API CinetPay /v2/payment/check.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmationToken]
              properties:
                confirmationToken:
                  type: string
                  description: Jeton reçu dans l'URL de retour (paramètre ct)
      responses:
        '200':
          description: >-
            Paiement confirmé (status=confirmed) ou encore en attente de validation
            Mobile Money côté CinetPay (status=pending, à revérifier plus tard)
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          description: Jeton de confirmation invalide
        '404':
          $ref: '#/components/responses/NotFound'
  /cinetpay/notify:
    post:
      summary: Notification serveur-à-serveur CinetPay (webhook)
      description: >-
        Appelée directement par CinetPay en application/x-www-form-urlencoded. Le corps
        n'est jamais pris pour argent comptant: seul l'identifiant de transaction
        (cpm_trans_id) est utilisé pour déclencher une revérification via l'API CinetPay.
      responses:
        '200':
          description: Notification traitée (paiement retrouvé et statut revérifié)
        '404':
          description: Transaction CinetPay inconnue
  /import-requests:
    post:
      summary: Soumet une demande d'importation (produit repéré chez un fournisseur)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequestInput'
      responses:
        '201':
          description: Demande créée avec le statut 'submitted'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: Authentification requise
    get:
      summary: Liste les demandes d'importation visibles par le rôle du client authentifié
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [submitted, quoted, compliance_cleared, ordered, delivered, rejected, cancelled]
      responses:
        '200':
          description: Liste des demandes
        '401':
          description: Authentification requise
  /import-requests/{id}/claim:
    post:
      summary: Un membre staff s'affecte une demande non assignée au statut 'submitted'
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ImportRequestId'
      responses:
        '200':
          description: Demande affectée
        '409':
          description: Demande déjà affectée ou plus au statut 'submitted'
  /import-requests/{id}/quote:
    post:
      summary: Chiffre une demande (produit + transport + douane estimée)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ImportRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quoteAmount, quoteCurrency]
              properties:
                quoteAmount:
                  type: number
                quoteCurrency:
                  type: string
                  enum: [USD, CDF, EUR]
                staffNotes:
                  type: string
      responses:
        '200':
          description: Demande chiffrée, passe au statut 'quoted'
        '409':
          description: Demande pas au statut 'submitted', ou non affectée à ce membre staff
  /import-requests/{id}/compliance:
    post:
      summary: >-
        Enregistre le contrôle de conformité (normes applicables, code douanier, certificats
        fournisseur vérifiés) — étape obligatoire avant de pouvoir déclarer la demande commandée.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ImportRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [complianceNotes]
              properties:
                complianceNotes:
                  type: string
                  minLength: 10
      responses:
        '200':
          description: Conformité enregistrée, passe au statut 'compliance_cleared'
        '409':
          description: Demande pas au statut 'quoted', ou non affectée à ce membre staff
  /import-requests/{id}/status:
    patch:
      summary: Fait avancer une demande vers 'ordered', 'delivered', 'rejected' ou 'cancelled'
      description: >-
        'ordered' n'est atteignable que depuis 'compliance_cleared': aucune commande fournisseur
        ne peut être déclarée passée sans contrôle de conformité enregistré au préalable.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ImportRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [ordered, delivered, rejected, cancelled]
                staffNotes:
                  type: string
                  description: Requis si status = rejected (motif du refus)
      responses:
        '200':
          description: Statut mis à jour
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          description: Transition non autorisée depuis le statut actuel
  /import-requests/{id}/cancel:
    post:
      summary: Le client annule sa propre demande, tant qu'elle n'a pas encore été commandée
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ImportRequestId'
      responses:
        '200':
          description: Demande annulée
        '409':
          description: Demande déjà commandée ou finalisée, impossible à annuler
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProductId:
      in: path
      name: id
      required: true
      schema:
        type: string
    SessionId:
      in: path
      name: sessionId
      required: true
      schema:
        type: string
        format: uuid
    OrderId:
      in: path
      name: orderId
      required: true
      schema:
        type: string
        format: uuid
    ImportRequestId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
  responses:
    InvalidRequest:
      description: Requête invalide ou règle métier non satisfaite
    NotFound:
      description: Ressource introuvable
  schemas:
    CartItem:
      type: object
      required: [id, qty]
      properties:
        id:
          type: string
          maxLength: 32
        qty:
          type: integer
          minimum: 1
          maximum: 10000
    CartRequest:
      type: object
      required: [sessionId, items]
      properties:
        sessionId:
          type: string
          format: uuid
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/CartItem'
    OrderRequest:
      type: object
      required: [customer, currency, paymentProvider, items]
      properties:
        customer:
          type: object
          required: [fullName, phone]
          properties:
            fullName:
              type: string
              minLength: 2
              maxLength: 120
            phone:
              type: string
              minLength: 6
              maxLength: 30
            email:
              type: string
              format: email
        currency:
          type: string
          enum: [USD, CDF, EUR]
        paymentProvider:
          type: string
          enum: [paypal, cinetpay, airtel_money, orange_money]
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/CartItem'
    ImportRequestInput:
      type: object
      required: [description, targetQty]
      properties:
        sourceUrl:
          type: string
          format: uri
          maxLength: 2048
        description:
          type: string
          minLength: 10
          maxLength: 2000
        targetQty:
          type: number
          exclusiveMinimum: 0
          maximum: 1000000
